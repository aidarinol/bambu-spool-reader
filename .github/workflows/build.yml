name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit-test parser against sample tag dump
        run: |
          mkdir -p /tmp/t
          javac -d /tmp/t app/src/main/java/id/min3d/spoolreader/SpoolData.java app/src/main/java/id/min3d/spoolreader/ColorDb.java test/ParserTest.java
          java -cp /tmp/t ParserTest

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/signing.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Using persistent key from repository secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PW="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No KEYSTORE secrets set - signing with a one-time key. Uninstall the old app before installing this build."
            PW="$(openssl rand -base64 24)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias spoolreader -keyalg RSA -keysize 3072 \
              -validity 20000 -storepass "$PW" -keypass "$PW" -dname "CN=Min3D Studio Spool Reader, O=Min3D Studio, C=ID"
          fi
          echo "::add-mask::$PW"
          echo "SIGNING_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SpoolReader-v1.0.${{ github.run_number }}.apk"
          sha256sum out/*.apk | tee out/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SpoolReader-apk
          path: out/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/*.apk out/SHA256.txt \
            --title "Spool Reader v1.0.${{ github.run_number }}" \
            --notes "Build otomatis dari commit ${{ github.sha }}. Unduh file .apk di bawah lalu pasang di HP."
